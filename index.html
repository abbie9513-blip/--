  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      min-height: 100%;
      margin: 0;
    }

    body {
      position: relative;
      isolation: isolate;
      min-height: 100vh;
      overflow: auto;
      background:
        radial-gradient(ellipse at 77% 20%, rgba(255, 244, 207, .88), transparent 24%),
        linear-gradient(180deg, #5b9bcf 0%, #9bc9e7 53%, #e3dfcf 100%);
      color: #163c55;
      font-family: "Segoe UI", "Noto Sans TC", sans-serif;
    }

    body::before,
    body::after {
      content: "";
      position: absolute;
      z-index: -1;
      width: 190px;
      height: 48px;
      border-radius: 999px;
      background: #fff;
      opacity: .58;
      filter: blur(2px);
      box-shadow:
        34px -17px 0 -4px #fff,
        81px -23px 0 0 #fff,
        129px -12px 0 -5px #fff;
    }

    body::before {
      top: 34vh;
      left: 12vw;
    }

    body::after {
      right: 10vw;
      bottom: 17vh;
      transform: scale(.8);
    }

    main {
      position: relative;
      z-index: 1;
      padding: 32px;
    }

    @media (max-width: 600px) {
      body::before { left: -90px; }
      body::after { right: -100px; }
      main { padding: 24px; }
    }
  </style>
</head>
